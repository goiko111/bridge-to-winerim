name = "winerim-middleware-runtime"
main = "cloudflare/workers/middleware-runtime/src/worker.ts"
compatibility_date = "2026-06-12"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[env.staging]
name = "winerim-middleware-runtime-staging"
workers_dev = false

[env.staging.vars]
ENVIRONMENT = "staging"
RELEASE = "staging-inert"
RUNTIME_EXECUTION_ENABLED = "false"

[[env.staging.hyperdrive]]
binding = "MIDDLEWARE_DB"
id = "0adae4108e4241f19cf5ba2709cbc69f"

[[env.staging.services]]
binding = "RUNTIME_EXECUTOR"
service = "winerim-middleware-runtime-executor-staging"

[env.staging.triggers]
crons = ["*/5 * * * *"]

[[env.staging.queues.producers]]
binding = "MIDDLEWARE_CATALOG_QUEUE"
queue = "winerim-staging-catalog"

[[env.staging.queues.producers]]
binding = "MIDDLEWARE_SALES_STOCK_QUEUE"
queue = "winerim-staging-sales"

[[env.staging.queues.producers]]
binding = "MIDDLEWARE_SALES_IMPORT_QUEUE"
queue = "winerim-staging-sales"

[[env.staging.queues.producers]]
binding = "MIDDLEWARE_STOCK_SYNC_QUEUE"
queue = "winerim-staging-stock"

[[env.staging.queues.producers]]
binding = "MIDDLEWARE_OUTBOUND_QUEUE"
queue = "winerim-staging-outbound"

[[env.staging.queues.producers]]
binding = "MIDDLEWARE_MAINTENANCE_QUEUE"
queue = "winerim-staging-maintenance"

# Canary-only consumer. Keep execution disabled until the private executor,
# vault binding and one reviewed stock envelope have passed remote readiness.
[[env.staging.queues.consumers]]
queue = "winerim-staging-stock"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
max_concurrency = 1
dead_letter_queue = "winerim-staging-dead-letter"
