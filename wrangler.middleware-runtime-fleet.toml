name = "winerim-middleware-runtime-rescue-prod-fleet"
main = "cloudflare/workers/middleware-runtime/src/worker.ts"
compatibility_date = "2026-06-12"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[vars]
ENVIRONMENT = "rescue-production"
RELEASE = "rescue-production-fleet-inert"
RUNTIME_MODE = "fleet-producer"
RUNTIME_EXECUTION_ENABLED = "false"
FLEET_RUNTIME_LANE = "sales-stock"

[[hyperdrive]]
binding = "MIDDLEWARE_DB"
id = "bf568eb1d85a41539384f241084c2227"

[[services]]
binding = "RUNTIME_EXECUTOR"
service = "winerim-middleware-runtime-executor-rescue-prod-fleet"

[triggers]
crons = ["*/5 * * * *"]

[[queues.producers]]
binding = "MIDDLEWARE_CATALOG_QUEUE"
queue = "winerim-rescue-prod-catalog"

[[queues.producers]]
binding = "MIDDLEWARE_SALES_STOCK_QUEUE"
queue = "winerim-rescue-prod-sales"

[[queues.producers]]
binding = "MIDDLEWARE_SALES_IMPORT_QUEUE"
queue = "winerim-rescue-prod-sales"

[[queues.producers]]
binding = "MIDDLEWARE_STOCK_SYNC_QUEUE"
queue = "winerim-rescue-prod-stock"

[[queues.producers]]
binding = "MIDDLEWARE_OUTBOUND_QUEUE"
queue = "winerim-rescue-prod-outbound"

[[queues.producers]]
binding = "MIDDLEWARE_MAINTENANCE_QUEUE"
queue = "winerim-rescue-prod-maintenance"

# Intentionally no Queue consumer. The reviewed consumer gate must add exactly
# one rescue Queue and its winerim-rescue-prod-dead-letter binding separately.
