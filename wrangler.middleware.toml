name = "winerim-middleware-api"
main = "cloudflare/workers/middleware-api/src/index.ts"
compatibility_date = "2026-05-03"
workers_dev = true

[vars]
ENVIRONMENT = "local"
RELEASE = "dev"
ALLOWED_ORIGIN = "http://127.0.0.1:8084"
ALLOWED_ORIGINS = "http://127.0.0.1:8084,http://localhost:8084"

[env.staging]
name = "winerim-middleware-api-staging"
workers_dev = true
routes = [
  { pattern = "api-staging.middleware.winerim.wine/*", zone_name = "winerim.wine" }
]

[env.staging.vars]
ENVIRONMENT = "staging"
RELEASE = "staging"
ALLOWED_ORIGIN = "https://staging.middleware.winerim.wine"
ALLOWED_ORIGINS = "https://staging.middleware.winerim.wine"

[env.production]
name = "winerim-middleware-api"
workers_dev = false
routes = [
  { pattern = "api.middleware.winerim.wine/*", zone_name = "winerim.wine" }
]

[env.production.vars]
ENVIRONMENT = "production"
RELEASE = "production"
ALLOWED_ORIGIN = "https://middleware.winerim.wine"
ALLOWED_ORIGINS = "https://middleware.winerim.wine"
