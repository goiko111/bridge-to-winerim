name = "winerim-middleware-runtime"
main = "cloudflare/workers/middleware-runtime/src/worker.ts"
compatibility_date = "2026-06-12"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[env.staging]
name = "winerim-middleware-runtime-staging"
workers_dev = false

[env.staging.vars]
ENVIRONMENT = "staging"
RELEASE = "staging-single-connection-canary"
RUNTIME_EXECUTION_ENABLED = "true"
RUNTIME_CANARY_CONNECTION_ID = "00000000-0000-4000-8000-000000000000"

[[env.staging.hyperdrive]]
binding = "MIDDLEWARE_DB"
id = "0adae4108e4241f19cf5ba2709cbc69f"

[[env.staging.services]]
binding = "RUNTIME_EXECUTOR"
service = "winerim-middleware-runtime-executor-staging"

# No cron and no producers: this file can consume exactly one reviewed lane.
[[env.staging.queues.consumers]]
queue = "winerim-staging-stock"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
max_concurrency = 1
dead_letter_queue = "winerim-staging-dead-letter"
