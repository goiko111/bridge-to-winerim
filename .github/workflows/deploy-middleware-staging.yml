name: Deploy middleware staging

on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: "Type staging-only to confirm this must not touch production"
        required: true
        type: string
      apply_migrations:
        description: "Apply control-plane migrations to the staging database"
        required: true
        default: false
        type: boolean
      deploy_worker:
        description: "Deploy the staging Worker"
        required: true
        default: true
        type: boolean
      deploy_pages:
        description: "Build and deploy staging Pages"
        required: true
        default: false
        type: boolean

concurrency:
  group: middleware-staging
  cancel-in-progress: false

jobs:
  guard:
    name: Safety guard
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.guard.outputs.ok }}
    steps:
      - id: guard
        run: |
          if [ "${{ inputs.confirm_target }}" != "staging-only" ]; then
            echo "confirm_target must be exactly: staging-only" >&2
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate staging bundle
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx esbuild cloudflare/workers/middleware-api/src/index.ts --bundle --platform=browser --format=esm --outfile=/tmp/middleware-worker-check.js
      - run: npx esbuild src/lib/middlewareOnboarding.ts --bundle --platform=browser --format=esm --outfile=/tmp/middleware-onboarding-check.js
      - run: node --check scripts/smoke-middleware-api.mjs

  migrate:
    name: Apply staging control-plane migrations
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ inputs.apply_migrations }}
    environment: middleware-staging
    steps:
      - uses: actions/checkout@v4
      - name: Check staging database secret
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          if [ -z "$STAGING_DB_URL" ]; then
            echo "Missing STAGING_DB_URL secret in middleware-staging environment." >&2
            exit 1
          fi
      - name: Apply control-plane migrations only
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          psql "$STAGING_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260629151602_connection_notification_contacts.sql
          psql "$STAGING_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260630063407_integration_onboarding_requests.sql

  deploy-worker:
    name: Deploy staging Worker
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ inputs.deploy_worker }}
    environment: middleware-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check Worker staging secrets
        env:
          LOVABLE_CLOUD_URL: ${{ secrets.LOVABLE_CLOUD_URL }}
          LOVABLE_SERVICE_ROLE_KEY: ${{ secrets.LOVABLE_SERVICE_ROLE_KEY }}
          MIDDLEWARE_ADMIN_TOKEN: ${{ secrets.MIDDLEWARE_ADMIN_TOKEN }}
        run: |
          test -n "$LOVABLE_CLOUD_URL" || (echo "Missing LOVABLE_CLOUD_URL" >&2; exit 1)
          test -n "$LOVABLE_SERVICE_ROLE_KEY" || (echo "Missing LOVABLE_SERVICE_ROLE_KEY" >&2; exit 1)
          test -n "$MIDDLEWARE_ADMIN_TOKEN" || (echo "Missing MIDDLEWARE_ADMIN_TOKEN" >&2; exit 1)
      - name: Configure Worker staging secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LOVABLE_CLOUD_URL: ${{ secrets.LOVABLE_CLOUD_URL }}
          LOVABLE_SERVICE_ROLE_KEY: ${{ secrets.LOVABLE_SERVICE_ROLE_KEY }}
          MIDDLEWARE_ADMIN_TOKEN: ${{ secrets.MIDDLEWARE_ADMIN_TOKEN }}
        run: |
          printf '%s' "$LOVABLE_CLOUD_URL" | npx wrangler secret put LOVABLE_CLOUD_URL --config wrangler.middleware.toml --env staging
          printf '%s' "$LOVABLE_SERVICE_ROLE_KEY" | npx wrangler secret put LOVABLE_SERVICE_ROLE_KEY --config wrangler.middleware.toml --env staging
          printf '%s' "$MIDDLEWARE_ADMIN_TOKEN" | npx wrangler secret put MIDDLEWARE_ADMIN_TOKEN --config wrangler.middleware.toml --env staging
      - name: Deploy Worker to staging only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.middleware.toml --env staging
      - name: Smoke test public staging endpoints
        run: npm run cf:api:smoke:staging
      - name: Smoke test protected staging endpoints
        env:
          MIDDLEWARE_ADMIN_TOKEN: ${{ secrets.MIDDLEWARE_ADMIN_TOKEN }}
        run: npm run cf:api:smoke:staging

  deploy-pages:
    name: Deploy staging Pages
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ inputs.deploy_pages }}
    environment: middleware-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build staging frontend
        env:
          VITE_MIDDLEWARE_API_URL: https://api-staging.middleware.winerim.wine
        run: npm run build
      - name: Deploy Pages to staging only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name winerim-middleware-staging --branch staging
