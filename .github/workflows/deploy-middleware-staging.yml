name: Deploy middleware staging

on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: "Type staging-only to confirm this must not touch production"
        required: true
        type: string
      confirm_sha:
        description: "Exact reviewed commit SHA to deploy"
        required: true
        type: string
      migration_mode:
        description: "Database operation: none or empty bootstrap (existing staging upgrades run only from a durable operator host)"
        required: true
        default: none
        type: choice
        options:
          - none
          - bootstrap-empty
      apply_migrations:
        description: "Apply the reviewed staging bootstrap/migrations"
        required: true
        default: false
        type: boolean
      deploy_worker:
        description: "Deploy the staging Worker"
        required: true
        default: true
        type: boolean
      deploy_pages:
        description: "Build and deploy staging Pages after API smoke"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: middleware-staging
  cancel-in-progress: false

jobs:
  validate:
    name: Validate reviewed staging source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify explicit target and immutable source
        env:
          CONFIRM_TARGET: ${{ inputs.confirm_target }}
          CONFIRM_SHA: ${{ inputs.confirm_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          test "$CONFIRM_TARGET" = "staging-only" || (echo "confirm_target must be staging-only" >&2; exit 1)
          test "$CONFIRM_SHA" = "$ACTUAL_SHA" || (echo "confirm_sha does not match the workflow commit" >&2; exit 1)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify staging requires Cloudflare Access JWT
        run: |
          access_required="$(awk '
            $0 == "[env.staging.vars]" { in_staging = 1; next }
            in_staging && /^\[/ { exit }
            in_staging && $1 == "REQUIRE_ACCESS_JWT" {
              value = $3
              gsub(/"/, "", value)
              print value
              exit
            }
          ' wrangler.middleware.toml)"
          test "$access_required" = "true" || (echo "Staging must require Access JWT before static admin secrets can be omitted" >&2; exit 1)
      - run: npx tsc --noEmit --pretty false
      - run: npx vitest run src/test/middlewareOnboarding.test.ts src/test/middlewareWorkerSecurity.test.ts src/test/integrationChecklist.test.ts src/test/cloudflareDbAdapter.test.ts src/test/cloudflareDbSql.test.ts src/test/cloudflareRuntime*.test.ts src/test/stagingRuntimeUpgrade.test.ts
      - run: npx wrangler deploy --config wrangler.middleware.toml --env staging --dry-run --outdir /tmp/middleware-worker-check
      - run: npx wrangler deploy --config wrangler.middleware-runtime.toml --env staging --dry-run --outdir /tmp/middleware-runtime-check
      - run: infrastructure/postgres/smoke-local-worker.sh
      - name: Verify reviewed 28-to-30 upgrade and rollback locally
        run: |
          PATH="$(pg_config --bindir):$PATH" infrastructure/postgres/test-runtime-upgrade.sh
      - run: node --check scripts/smoke-middleware-api.mjs

  release:
    name: Verify, migrate and deploy staging serially
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    environment: middleware-staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Verify staging database target before bootstrap
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}
          MIGRATION_MODE: ${{ inputs.migration_mode }}
        run: |
          test -n "$STAGING_DB_URL" || (echo "Missing STAGING_DB_URL" >&2; exit 1)
          STAGING_DATABASE_URL="$STAGING_DB_URL" node infrastructure/postgres/staging-target.mjs >/dev/null
          connected_name="$(psql "$STAGING_DB_URL" -XAtqc "select current_database()")"
          test "$connected_name" = postgres || (echo "Connected database identity is not the immutable postgres target" >&2; exit 1)

          has_sentinel="$(psql "$STAGING_DB_URL" -XAtqc "select to_regclass('public.infrastructure_metadata') is not null")"
          if [ "$has_sentinel" = "t" ]; then
            identity="$(psql "$STAGING_DB_URL" -XAtqc "select value from public.infrastructure_metadata where key = 'environment'")"
            test "$identity" = "staging" || (echo "Existing database sentinel is not staging" >&2; exit 1)
            table_count="$(psql "$STAGING_DB_URL" -XAtqc "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='r'")"
            if [ "$table_count" = 28 ]; then
              echo "28-table staging must be upgraded manually from a durable encrypted operator host before this workflow may deploy" >&2
              exit 1
            elif [ "$table_count" = 30 ]; then
              test "$MIGRATION_MODE" = none || (echo "30-table staging must use migration_mode=none" >&2; exit 1)
            else
              echo "Existing staging inventory is neither reviewed pre-upgrade nor post-upgrade" >&2
              exit 1
            fi
          else
            test "$APPLY_MIGRATIONS" = "true" || (echo "Empty staging database requires apply_migrations=true" >&2; exit 1)
            test "$MIGRATION_MODE" = bootstrap-empty || (echo "Empty staging database requires migration_mode=bootstrap-empty" >&2; exit 1)
            has_core_schema="$(psql "$STAGING_DB_URL" -XAtqc "select to_regclass('public.pos_connections') is not null")"
            test "$has_core_schema" = "f" || (echo "Refusing bootstrap: core schema exists without the staging sentinel" >&2; exit 1)
            echo "Verified empty staging target; bootstrap is permitted"
          fi

      - name: Apply reviewed staging migrations
        if: ${{ inputs.apply_migrations }}
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          MIGRATION_MODE: ${{ inputs.migration_mode }}
        run: |
          case "$MIGRATION_MODE" in
            bootstrap-empty)
              infrastructure/postgres/apply-staging.sh "$STAGING_DB_URL"
              ;;
            *) echo "apply_migrations requires a reviewed migration_mode" >&2; exit 1 ;;
          esac

      - name: Verify staging identity and database contract after bootstrap
        env:
          DATABASE_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          identity="$(psql "$DATABASE_URL" -XAtqc "select value from public.infrastructure_metadata where key = 'environment'")"
          connected_name="$(psql "$DATABASE_URL" -XAtqc "select current_database()")"
          has_core_schema="$(psql "$DATABASE_URL" -XAtqc "select to_regclass('public.pos_connections') is not null")"
          test "$identity" = "staging" || (echo "Post-bootstrap database sentinel is not staging" >&2; exit 1)
          test "$connected_name" = postgres || (echo "Post-bootstrap database name is not postgres" >&2; exit 1)
          test "$has_core_schema" = "t" || (echo "Post-bootstrap core schema is missing" >&2; exit 1)
          infrastructure/postgres/validate.sh

      - name: Verify Cloudflare and Access service credentials
        if: ${{ inputs.deploy_worker || inputs.deploy_pages }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          MIDDLEWARE_ADMIN_TOKEN: ${{ secrets.MIDDLEWARE_ADMIN_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" >&2; exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" >&2; exit 1)
          test -n "$CF_ACCESS_CLIENT_ID" || (echo "Missing CF_ACCESS_CLIENT_ID" >&2; exit 1)
          test -n "$CF_ACCESS_CLIENT_SECRET" || (echo "Missing CF_ACCESS_CLIENT_SECRET" >&2; exit 1)
          test -n "$MIDDLEWARE_ADMIN_TOKEN" || (echo "Missing MIDDLEWARE_ADMIN_TOKEN" >&2; exit 1)
          npx wrangler whoami >/dev/null

      - name: Capture current Worker rollback version
        if: ${{ inputs.deploy_worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          previous="$(npx wrangler deployments list --config wrangler.middleware.toml --env staging --json | jq -er '.[-1].versions[0].version_id')"
          echo "PREVIOUS_WORKER_VERSION=$previous" >> "$GITHUB_ENV"

      - name: Deploy Worker to staging only
        if: ${{ inputs.deploy_worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.middleware.toml --env staging

      - name: Verify API denial and readiness through Cloudflare Access
        if: ${{ inputs.deploy_worker || inputs.deploy_pages }}
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          MIDDLEWARE_ADMIN_TOKEN: ${{ secrets.MIDDLEWARE_ADMIN_TOKEN }}
        run: |
          public_status="$(curl --silent --output /dev/null --max-time 10 --write-out '%{http_code}' \
            https://api-staging.middleware.winerim.wine/ready)"
          test "$public_status" != "200" || (echo "Protected staging readiness is public" >&2; exit 1)
          body="$(curl --fail --silent --show-error --max-time 10 \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H "X-Middleware-Token: $MIDDLEWARE_ADMIN_TOKEN" \
            https://api-staging.middleware.winerim.wine/ready)"
          jq -e '.ok == true and .database == "staging"' <<<"$body" >/dev/null

      - name: Roll back Worker after failed post-deploy verification
        if: ${{ failure() && inputs.deploy_worker && env.PREVIOUS_WORKER_VERSION != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler rollback "$PREVIOUS_WORKER_VERSION" --config wrangler.middleware.toml --env staging --message "Automatic rollback after staging smoke failure" --yes

      - name: Build staging frontend
        if: ${{ success() && inputs.deploy_pages }}
        env:
          VITE_MIDDLEWARE_API_URL: https://api-staging.middleware.winerim.wine
        run: npm run build

      - name: Deploy Pages to protected staging
        if: ${{ success() && inputs.deploy_pages }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name winerim-middleware-staging --branch staging

      - name: Verify Pages is not public without Access
        if: ${{ success() && inputs.deploy_pages }}
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          public_status="$(curl --silent --output /dev/null --max-time 10 --write-out '%{http_code}' \
            https://staging.middleware.winerim.wine/)"
          test "$public_status" != "200" || (echo "Protected staging Pages is public" >&2; exit 1)
          curl --fail --silent --show-error --max-time 10 \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            https://staging.middleware.winerim.wine/ >/dev/null
